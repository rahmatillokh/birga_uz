# /etc/nginx/sites-available/yuniqo.aysapps.uz.conf
#
# O'rnatish (bir marta):
#   sudo cp deploy/nginx/yuniqo.aysapps.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/yuniqo.aysapps.uz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# SSL (DNS: yuniqo.aysapps.uz A → 169.58.147.237 bo'lgach):
#   sudo certbot --nginx -d yuniqo.aysapps.uz --redirect
# Certbot 443 blokini va HTTP→HTTPS yo'naltirishni o'zi qo'shadi.

upstream yuniqo_app {
    # systemd: yuniqo-web.service → next start -H 127.0.0.1 -p 8030
    # (8000 edu360, 8001 marketpos, 8002 avtolingo)
    server 127.0.0.1:8030;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name yuniqo.aysapps.uz;

    access_log /var/log/nginx/yuniqo.access.log;
    error_log  /var/log/nginx/yuniqo.error.log warn;

    client_max_body_size 5m;

    # JSON/JS/CSS siqish (faqat shu sayt uchun). AI oqimida o'chiriladi.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml application/manifest+json;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # AI chat oqimi (streaming) — buferlashsiz
    location /api/ai/ {
        proxy_pass http://yuniqo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://yuniqo_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
